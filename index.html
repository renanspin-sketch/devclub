<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DevClub — portfólio de desenvolvimento front-end."
    />
    <title>DevClub</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint — sem isso, a página
      // sempre nasceria escura (padrão) e só trocaria pra clara depois que
      // o React montasse e lesse o `localStorage`, piscando a cada reload
      // pra quem escolheu o tema claro.
      (function () {
        try {
          if (localStorage.getItem("devclub-theme") === "light") {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {
          // localStorage indisponível (modo privado etc.) — fica no escuro,
          // que é o padrão do site.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
